# iOS pipeline
#   every run         → "Test" (Mac): build for testing once (generic simulator, while the simulator boots),
#                       then three suites on that build and simulator: unit tests, "Integration · dev"
#                       (live API tests against the dev server; same-repo PRs only, forks get no secrets) and
#                       "Integration · prod" (pushes only; continue-on-error: production may lag develop).
#   push to develop   → in parallel with Test: "Archive & upload" (Mac) sends the build straight to
#                       TestFlight (internal testers get it once Apple has processed it; nothing waits).
#   push to main      → the same two jobs, then "Submit for App Review" (Linux, needs Test and Archive):
#                       store listing text (store/en-US) and App Review submission (released when approved).
#                       A failing test blocks the release. Screenshots stay as last uploaded by the manual
#                       store-screenshots.yml.
# Xcode's compilation cache (CAS) is kept between runs per job (actions/cache, keyed on the Xcode version;
# only pushes save it). Mac minutes cost ~10x Linux minutes, so anything that only waits on Apple runs on Linux.
# Docs-only commits don't run; a newer push to develop cancels the older run (main never cancels).
#
# Signing is automatic via an App Store Connect API key — see SETUP.md.
# Version: <VERSION file>.<run number>; build number: run number (always increasing).
name: iOS

on:
  push:
    branches: [main, develop]
    # Screenshots have their own manual workflow (store-screenshots.yml). Listing text changes do run this
    # pipeline: a release to main publishes them.
    paths-ignore: ['**/*.md', 'scripts/ci/screenshots.sh', 'scripts/ci/compose_screenshots.py',
                   'scripts/ci/duo_hinge.m', 'store/en-US/captions.txt', '.github/workflows/store-*.yml']
  pull_request:
    paths-ignore: ['**/*.md', 'store/**', '.github/workflows/store-*.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    env:
      COMPILATION_CACHE_DIR: build/CompilationCache
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ vars.XCODE_VERSION || '27.2' }}
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION || '27.2' }}
        run: bash scripts/ci/select_xcode.sh
      - name: Xcode build version
        id: xcode
        run: echo "build=$(xcodebuild -version | tail -1 | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Restore compilation cache
        uses: actions/cache/restore@v6
        with:
          path: build/CompilationCache
          key: ios-cas-test-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: ios-cas-test-${{ steps.xcode.outputs.build }}-
      - name: Build for testing
        id: build
        run: bash scripts/ci/test.sh build
      - name: Unit tests
        run: bash scripts/ci/test.sh unit "Unit tests"
      # Live API tests through the app's APIClient. Server and key reach the test process as
      # TEST_RUNNER_ATTND_IT_* (scripts/ci/test.sh). They never gate a release on main.
      - name: Integration · dev
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        env:
          ATTND_IT_SERVER: dev.attnd.app
          ATTND_IT_KEY: ${{ secrets.ATTND_API_KEY }}
        run: bash scripts/ci/test.sh integration "Integration · dev"
      - name: Integration · prod
        id: prod
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          ATTND_IT_SERVER: attnd.app
          ATTND_IT_KEY: ${{ secrets.ATTND_PROD_CI_KEY }}
        run: bash scripts/ci/test.sh integration "Integration · prod"
      - name: Integration · prod failed (allowed)
        if: ${{ !cancelled() && steps.prod.outcome == 'failure' }}
        run: |
          echo "::warning title=Integration · prod::Live API tests failed against attnd.app (allowed: production may be behind develop). The run stays green."
          echo "Integration · prod failed — allowed (continue-on-error); production may be behind develop." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Save compilation cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: build/CompilationCache
          key: ios-cas-test-${{ steps.xcode.outputs.build }}-${{ github.sha }}

  archive:
    name: Archive & upload
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ATTND_SERVER: ${{ vars.ATTND_SERVER || 'attnd.app' }}
      COMPILATION_CACHE_DIR: build/CompilationCache
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ vars.XCODE_VERSION || '27.2' }}
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION || '27.2' }}
        run: bash scripts/ci/select_xcode.sh
      - name: Xcode build version
        id: xcode
        run: echo "build=$(xcodebuild -version | tail -1 | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Restore compilation cache
        uses: actions/cache/restore@v6
        with:
          path: build/CompilationCache
          key: ios-cas-archive-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: ios-cas-archive-${{ steps.xcode.outputs.build }}-
      - name: Version
        run: |
          echo "MARKETING_VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: App Store Connect tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet --disable-pip-version-check "pyjwt[crypto]"
          echo "$RUNNER_TEMP/asc/bin" >> "$GITHUB_PATH"
      - name: Check App Store Connect key
        run: python scripts/ci/asc.py check
      # Without the stored development certificate (SETUP.md 3e) each runner mints a new one and Apple's
      # limit fills up: revoke earlier CI-created ones (only "Created via API" development certificates
      # older than 90 min; never distribution or hand-made ones).
      - name: Free development certificate slots
        env:
          IOS_DEV_CERT_P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
        run: |
          if [ -n "$IOS_DEV_CERT_P12_BASE64" ]; then echo "Stored certificate in use; nothing to revoke"; exit 0; fi
          python scripts/ci/asc.py revoke-ci-dev-certs 90
      - name: Archive & upload
        id: archive
        env:
          IOS_DEV_CERT_P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: bash scripts/ci/archive_upload.sh
      - name: Save compilation cache
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: build/CompilationCache
          key: ios-cas-archive-${{ steps.xcode.outputs.build }}-${{ github.sha }}

  # Releases only. Waiting on Apple's processing and submitting for review needs no Mac.
  publish:
    name: Submit for App Review
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, archive]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: production
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci
            store
            VERSION
      - name: Version
        run: |
          echo "MARKETING_VERSION=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: App Store Connect tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet --disable-pip-version-check "pyjwt[crypto]"
          echo "$RUNNER_TEMP/asc/bin" >> "$GITHUB_PATH"
      - name: Store listing text
        env:
          REVIEW_CONTACT_FIRST_NAME: ${{ vars.REVIEW_CONTACT_FIRST_NAME }}
          REVIEW_CONTACT_LAST_NAME: ${{ vars.REVIEW_CONTACT_LAST_NAME }}
          REVIEW_CONTACT_PHONE: ${{ vars.REVIEW_CONTACT_PHONE }}
          REVIEW_CONTACT_EMAIL: ${{ vars.REVIEW_CONTACT_EMAIL }}
        run: python scripts/ci/asc.py metadata --version "$MARKETING_VERSION"
      - name: Submit for App Review
        env:
          # Empty: What's New comes from store/en-US/release_notes.txt (set by the step above).
          WHATS_NEW: ${{ vars.WHATS_NEW }}
        run: python scripts/ci/asc.py release --version "$MARKETING_VERSION" --build "$BUILD_NUMBER" --whats-new "$WHATS_NEW"
