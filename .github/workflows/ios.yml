name: iOS CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available --json | python3 -c "
import json, sys
d = json.load(sys.stdin)
for runtime, devices in d['devices'].items():
    if 'iOS' in runtime:
        for dev in devices:
            print(runtime, dev['name'])
" | sort | tail -20

      - name: Build and test
        env:
          ATTND_API_KEY: ${{ secrets.ATTND_API_KEY }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Attnd.xcodeproj \
            -scheme Attnd \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            ATTND_API_KEY="$ATTND_API_KEY" \
            -resultBundlePath TestResults.xcresult \
            | xcpretty --color

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: TestResults.xcresult
          retention-days: 14
