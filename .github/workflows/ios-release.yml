name: iOS Release

# Manually triggered only.
# Builds a signed IPA and uploads it to App Store Connect for review.

on:
  workflow_dispatch:

jobs:
  release:
    name: Archive & Upload to App Store
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      ARCHIVE_PATH: ${{ runner.temp }}/Attnd.xcarchive
      IPA_DIR:      ${{ runner.temp }}/Attnd-ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Code signing setup ───────────────────────────────────────────────────

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" build.keychain
          # Keep unlocked for the duration of the job
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Import distribution certificate
        env:
          CERT_BASE64:  ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # Allow codesign to access the key without a UI prompt
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/certificate.p12

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/Attnd_AppStore.mobileprovision

      # ── App Store Connect API key (used by altool for upload) ────────────────

      - name: Install App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_KEY_ID:      ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive
        env:
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          ATTND_API_KEY: ${{ secrets.ATTND_API_KEY }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Attnd.xcodeproj \
            -scheme Attnd \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=GQQX4L6TE2 \
            "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" \
            ATTND_API_KEY="$ATTND_API_KEY" \
            | xcpretty --color

      - name: Export IPA
        env:
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key>           <string>app-store</string>
            <key>teamID</key>           <string>GQQX4L6TE2</string>
            <key>signingStyle</key>     <string>manual</string>
            <key>uploadBitcode</key>    <false/>
            <key>uploadSymbols</key>    <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.arcu.Attnd</key> <string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath  "$IPA_DIR" \
            -exportOptionsPlist /tmp/ExportOptions.plist

      # ── Upload ───────────────────────────────────────────────────────────────

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_DIR/Attnd.ipa" \
            --apiKey    "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

      # ── Cleanup ──────────────────────────────────────────────────────────────

      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true
