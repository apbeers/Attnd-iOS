# One-off: convert Attnd.xcodeproj to Xcode 27.2's JSON project format (project.xcproj) on a real
# Xcode, check that the converted project still lists and builds, then commit it to develop and start
# the iOS pipeline. Runs when this file changes on develop (manual runs need the file on main);
# once project.xcproj exists it does nothing.
name: Convert Xcode project

on:
  push:
    branches: [develop]
    paths: ['.github/workflows/convert-project.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  convert:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Select Xcode ${{ vars.XCODE_VERSION || '27.2' }}
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION || '27.2' }}
        run: bash scripts/ci/select_xcode.sh
      - name: Convert to the JSON project format
        run: |
          set -euo pipefail
          if [ -f Attnd.xcodeproj/project.xcproj ]; then echo "Already converted."; exit 0; fi
          xcodebuild -help 2>&1 | grep -i -A3 "convert-project" || true
          # Sources disagree on the format argument; try each and keep the first that works.
          for format in "Xcode Project" xcproj "xcproj (JSON)"; do
            echo "::group::-convert-project \"$format\""
            if xcodebuild -project Attnd.xcodeproj -convert-project "$format"; then
              echo "::endgroup::"; break
            fi
            echo "::endgroup::"
          done
          ls -la Attnd.xcodeproj
          test -f Attnd.xcodeproj/project.xcproj || { echo "::error::Conversion produced no project.xcproj"; exit 1; }
      - name: The converted project lists and builds
        run: |
          set -euo pipefail
          xcodebuild -list -project Attnd.xcodeproj
          xcodebuild build -project Attnd.xcodeproj -scheme Attnd -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Commit and start the iOS pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Attnd.xcodeproj
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "Convert Attnd.xcodeproj to the Xcode 27.2 JSON project format (project.xcproj)" \
                     -m "Converted by xcodebuild -convert-project on $(xcodebuild -version | tr '\n' ' ')"
          git push origin HEAD:develop
          gh workflow run ios.yml --ref develop
